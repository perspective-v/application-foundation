name: Publish NuGet packages to Gitea

on:
  push:
    branches:
      - deploy/feed

permissions:
  contents: read

concurrency:
  group: gitea-nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    environment: nuget-publish

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PerspectiveVShell.sln

      - name: Build
        run: dotnet build PerspectiveVShell.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack PerspectiveVShell.sln --configuration Release --no-build --output artifacts/packages

      - name: Configure Gitea NuGet source
        env:
          NUGET_FEED_URL: ${{ secrets.NUGET_FEED_URL }}
          GITEA_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          GITEA_TOKEN: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [[ -z "$NUGET_FEED_URL" || -z "$GITEA_USERNAME" || -z "$GITEA_TOKEN" ]]; then
            echo "::error::Configure NUGET_FEED_URL, REGISTRY_USERNAME, and REGISTRY_PASSWORD as GitHub Actions secrets."
            exit 1
          fi

          dotnet nuget add source "$NUGET_FEED_URL" \
            --name gitea \
            --username "$GITEA_USERNAME" \
            --password "$GITEA_TOKEN" \
            --store-password-in-clear-text

      - name: Push packages
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No NuGet packages were produced."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --source gitea
          done
